[package]
name = "r-ereader-library"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
lopdf = { version = "0.45.0", default-features = false }
r-ereader-epub = { version = "0.1.0", path = "../epub" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }

[features]
# Geradores de EPUB/PDF para testes deste e de outros crates.
test-support = ["dep:zip", "image/png"]

[dev-dependencies]
r-ereader-library = { path = ".", features = ["test-support"] }
rusqlite = "0.40.2"
tempfile = "3.27.0"
